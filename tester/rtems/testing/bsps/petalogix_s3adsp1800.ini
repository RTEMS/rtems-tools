#
# The microblaze/petalogix_s3adsp1800 BSP.
#
# The BSP is little endian, so the machine gets the endianness property.  The
# two global properties make Qemu raise an exception for an illegal opcode and
# for the all zero opcode, which the BSP needs to report a fatal error.
#
[petalogix_s3adsp1800]
bsp           = petalogix_s3adsp1800
arch          = microblaze
tester        = %{_rtscripts}/qemu.cfg
bsp_qemu_opts = %{qemu_opts_base} %{qemu_opts_no_net} -serial mon:stdio -machine petalogix-s3adsp1800,endianness=little -cpu microblaze-cpu -global microblaze-cpu.ill-opcode-exception=true -global microblaze-cpu.opcode-0x0-illegal=true -m 256M
